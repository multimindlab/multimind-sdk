[pytest]
# Pytest configuration for MultiMind SDK
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=multimind
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70
    --asyncio-mode=auto
    --asyncio-default-fixture-loop-scope=function
markers =
    skip: marks tests as skipped (deselect with '-m "not skip"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    slow: marks tests as slow running
    requires_gpu: marks tests that require GPU
    requires_api_key: marks tests that require API keys
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:transformers
    ignore::pydantic.*:PydanticDeprecatedSince20

