[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimind-sdk"
version = "0.2.2"
description = "The Future of AI Development - 60+ Vector Databases • 100+ AI Models • Quantum Memory • Hybrid RAG • Enterprise Compliance"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache License 2.0"}
authors = [
    {name = "AI2Innovate Team", email = "contact@multimind.dev"}
]
keywords = [
    "ai", "artificial-intelligence", "llm", "machine-learning",
    "rag", "vector-database", "agents", "fine-tuning", "quantum-memory",
    "hybrid-rag", "enterprise-ai", "compliance", "multi-modal"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ============================================================
# CORE DEPENDENCIES - Always installed
# ============================================================
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=0.19.0",
    "aiohttp>=3.8.0",
    "typing-extensions>=4.0.0",
    "click>=8.1.0",
    "rich>=14.0.0",
    "coloredlogs>=15.0.0",
    "requests>=2.28.0",
    "numpy>=1.21.0",
    "pandas>=2.0.0",
    "tenacity>=8.2.0",
    "datasets>=2.0.0", 
]

# ============================================================
# OPTIONAL DEPENDENCIES - Install only what you need
# ============================================================
[project.optional-dependencies]

# Core LLM providers
llm = [
    "openai>=1.0.0",
    "anthropic>=0.52.1",
    "mistralai>=0.0.12",
]

# Router module
router = [
    "fastapi>=0.95.0",
    "uvicorn>=0.21.0",
    "httpx>=0.23.0",
]

# Memory systems
memory = [
    "redis>=5.0.0",
]

# Basic RAG
rag = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

# Advanced vector stores
vector-stores = [
    "chromadb>=1.0.0",
    "pinecone-client>=6.0.0",
    "weaviate-client>=3.0.0",
    "qdrant-client>=2.0.0",
    "pymilvus>=2.0.0",
    "elasticsearch>=8.0.0",
    "opensearch-py>=2.0.0",
    "astrapy>=1.0.0",
]

# Document processing
documents = [
    "pdfplumber>=0.9.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
    "pillow>=9.0.0",
    "opencv-python>=4.5.0",
    "pytesseract>=0.3.0",
    "unstructured>=0.10.0",
]

# Fine-tuning
fine-tuning = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "datasets>=2.0.0",
    "scikit-learn>=1.0.0",
]

# Advanced compliance
compliance = [
    "cryptography>=41.0.0",
    "pycryptodome>=3.18.0",
]

# Development & Testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

# Everything (all features)
all = [
    "multimind-sdk[llm,router,memory,rag,vector-stores,documents,fine-tuning,compliance,dev]",
]

# Minimal (just core + LLMs for quick start)
minimal = [
    "multimind-sdk[llm]",
]

[project.urls]
"Homepage" = "https://multimind.dev"
"Bug Tracker" = "https://github.com/multimind-dev/multimind-sdk/issues"
"Source Code" = "https://github.com/multimind-dev/multimind-sdk"
"Documentation" = "https://docs.multimind.dev"
"Discord" = "https://discord.gg/K64U65je7h"

[project.scripts]
multimind = "multimind.gateway.cli:main"

[tool.setuptools]
packages = ["multimind"]

[tool.setuptools.package-data]
multimind = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.8"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]
ignore = ["E501"]  # Black handles line length
exclude = [".git", "__pycache__", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning",
]
