name: Feature Request
description: Suggest a feature for MultiMind SDK
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Models / Multi-model
        - RAG / Vector stores
        - Agents
        - Compliance
        - CLI
        - Documentation
        - Other
